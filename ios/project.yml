name: QuillPost
options:
  bundleIdPrefix: io.github.socrtwo
  deploymentTarget:
    iOS: "16.0"
targets:
  QuillPost:
    type: application
    platform: iOS
    sources:
      - QuillPost
    info:
      path: QuillPost/Info.plist
      properties:
        CFBundleDisplayName: QuillPost
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "5"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        # The app talks to the user's own QuillPost server, which on a home network is often
        # plain http://192.168.x.y:8080. Allow that; HTTPS still works and is recommended
        # for servers reachable from the internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: QuillPost connects to the QuillPost server on your own network to show your mail.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.socrtwo.quillpost
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: 5
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  QuillPost:
    build:
      targets:
        QuillPost: all

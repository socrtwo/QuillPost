name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.1.0). Leave empty for a plain build."
        required: false
        default: ""

# Needed so the release step can create a GitHub Release on version tags.
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list includes the long-removed "tools" package, which
      # makes sdkmanager exit 1 before Gradle runs; platform-tools is all that is needed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      # A release is produced when a v* tag is pushed, or when this workflow is run
      # manually with a release_tag input (used when tags cannot be pushed directly).
      - name: Determine release tag
        id: rel
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: '${TAG:-<none>}'"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quillpost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Decode the signing keystore from a repository secret, if one is configured.
      # When the KEYSTORE_BASE64 secret is absent this is a no-op and the release
      # build stays unsigned (Gradle emits app-release-unsigned.apk). Once the
      # signing secrets are set, the release APK comes out pre-signed automatically.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Keystore configured -> release APK will be SIGNED."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret -> release APK will be UNSIGNED."
          fi

      - name: Build release APK
        env:
          # app/build.gradle.kts reads these; blank values mean "no signing config".
          QUILLPOST_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.configured == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          QUILLPOST_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QUILLPOST_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QUILLPOST_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Captures whichever the build produced: app-release.apk (signed) or
      # app-release-unsigned.apk (when no keystore secret is configured).
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quillpost-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Rename the release APK to include the tag so the download has a clear name.
      - name: Stage release asset
        if: steps.rel.outputs.tag != ''
        run: |
          mkdir -p release-assets
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          case "$SRC" in *unsigned*) SUFFIX="-unsigned";; *) SUFFIX="";; esac
          cp "$SRC" "release-assets/quillpost-${RELEASE_TAG}${SUFFIX}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/quillpost-${RELEASE_TAG}-debug.apk"

      # Publishes a numbered GitHub Release (shown in the repo's Releases section)
      # whenever a tag like v1.0.0 is pushed, attaching the built APKs.
      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anne's Post ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          body: |
            Downloads (built by GitHub Actions from this tag; assets from the other workflows are attached as they finish):
            - **Android / ChromeOS**: `quillpost-<tag>.apk` (signed when the repository has signing secrets, otherwise `-unsigned`) plus a debug APK. The app embeds the same Outlook-style client and junk engine as the desktop and web versions.
            - **Windows**: `quillpost-desktop-<tag>-windows-x64.msi`, or the portable zip.
            - **macOS**: `quillpost-desktop-<tag>-macos-arm64.dmg` (unsigned: right-click → Open, or `xattr -dr com.apple.quarantine`).
            - **Linux x64**: `quillpost-desktop-<tag>-linux-x64.deb`, or the portable tar.gz.
            - **Raspberry Pi OS (64-bit) / Linux arm64**: `quillpost-desktop-<tag>-linux-arm64.deb`, or the portable tar.gz.
            - **Web / any JVM (servers, Termux, ChromeOS Linux)**: `quillpost-web-<tag>-any-jvm.zip` — unzip and run `bin/quillpost-web`.
            - **iOS**: `QuillPost-iOS-simulator.app.zip` (unsigned simulator build; a device build needs an Apple Developer account). Shows the same client, served by an Anne's Post server on your network.
          files: release-assets/*.apk

name: iOS CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.1.0). Leave empty for a plain build."
        required: false
        default: ""

# Needed so the release step can create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build iOS app
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The latest XcodeGen emits the Xcode 16 project format; select a matching Xcode.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen
      # A release is produced when a v* tag is pushed, or when this workflow is run
      # manually with a release_tag input (used when tags cannot be pushed directly).
      - name: Determine release tag
        id: rel
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: '${TAG:-<none>}'"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (simulator, unsigned)
        run: |
          xcodebuild \
            -project QuillPost.xcodeproj \
            -scheme QuillPost \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Package simulator app
        run: |
          APP=$(find build/Build/Products -name "QuillPost.app" -type d | head -n 1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "QuillPost-iOS-simulator.app.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: quillpost-ios-simulator-app
          path: ios/QuillPost-iOS-simulator.app.zip
          if-no-files-found: error

      # An App Store / TestFlight build needs an Apple Developer account and signing
      # certificates; this unsigned simulator build is what can be produced without them.
      - name: Stage release asset
        if: steps.rel.outputs.tag != ''
        run: cp QuillPost-iOS-simulator.app.zip "QuillPost-iOS-simulator-${RELEASE_TAG}.app.zip"
      - name: Publish to GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anne's Post ${{ steps.rel.outputs.tag }}
          files: ios/QuillPost-iOS-simulator-${{ steps.rel.outputs.tag }}.app.zip
